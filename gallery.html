<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — iamrealikea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .gallery-header {
      padding: 100px 24px 60px;
      text-align: center;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gray);
      margin-bottom: 24px;
      transition: color var(--transition);
    }
    .back-btn:hover {
      color: var(--accent);
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      padding: 0 24px 100px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .gallery-item {
      aspect-ratio: 1;
      background: var(--dark-3);
      border-radius: var(--radius);
      border: 1px solid var(--dark-4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray);
      transition: all var(--transition);
    }
    .gallery-item:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(48, 169, 133, 0.08);
      color: var(--accent);
    }
  </style>
</head>
<body>
  
  <div class="gallery-header animate-in">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>
    <h1 class="section-title">My <span class="accent-text">Gallery</span></h1>
    <p class="section-subtitle">A collection of my recent work and photography.</p>
  </div>

  <div class="gallery-grid animate-in" style="--delay: 0.2s">
    <!-- Placeholders for gallery items -->
    <div class="gallery-item"><i class="fas fa-image fa-2x"></i></div>
    <div class="gallery-item"><i class="fas fa-image fa-2x"></i></div>
    <div class="gallery-item"><i class="fas fa-image fa-2x"></i></div>
    <div class="gallery-item"><i class="fas fa-image fa-2x"></i></div>
    <div class="gallery-item"><i class="fas fa-image fa-2x"></i></div>
    <div class="gallery-item"><i class="fas fa-image fa-2x"></i></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
